name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  safety-and-tests:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare pinned sources without game data
        run: ./scripts/bootstrap-dependencies.sh --sources-only
      - name: Repository safety and focused tests
        run: ./scripts/check-repository.sh

  # The published app: SunPad with MoltenVK and no engine, audited.
  published-app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Prepare pinned sources and MoltenVK
        run: ./scripts/bootstrap-dependencies.sh
      - name: Build and audit the published app
        run: ./scripts/build-ios-app.sh "$RUNNER_TEMP/SunPad-ios-unsigned.ipa"

  # What PadMint builds on a player's Mac: the engine for iPhone and iPad. No
  # game data in CI, ever; the engine is built from source and never uploaded.
  engine:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install LLVM and Ninja
        run: brew install llvm ninja
      - name: Prepare pinned sources without game data
        run: ./scripts/bootstrap-dependencies.sh --sources-only
      - name: Build the engine for iPhone and iPad
        run: ./scripts/build-engine.sh iphoneos "$RUNNER_TEMP/engine"
